<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar Cita - Barbería Style Good</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Barbería Style Good</h1>
        <p>Tu estilo, nuestra pasión</p>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="index.html#nosotros">Nosotros</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="galeria.html">Galería</a></li>
            <li><a href="precios.html">Precios</a></li>
            <li><a href="formularios.html#citas">Citas</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section id="citas">
            <h2>Reservar Cita</h2>
            <form class="form-cita" id="formCitas">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="70707070" required>
                </div>
                <div class="campo">
                    <label for="servicio">Servicio</label>
                    <select id="servicio" name="servicio" required>
                        <option value="" disabled selected>Seleccione</option>
                        <option>Corte de cabello</option>
                        <option>Limpieza facial</option>
                        <option>Afeitado tradicional</option>
                        <option>Arreglo de barba</option>
                        <option>Tinte de cabello</option>
                        <option>Ondulados y Encrespados</option>
                        <option>Corte + barba</option>
                        <option>Combo Cumpleañero</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="barbero">Barbero de preferencia</label>
                    <select id="barbero" name="barbero">
                        <option>Sin preferencia</option>
                        <option>Carlos</option>
                        <option>Miguel</option>
                        <option>Jhon</option>
                        <option>David</option>
                    </select>
                </div>
                <div class="campo">
                    <label>Extras</label>
                    <div class="extras">
                        <label class="check"><input type="checkbox" name="extras" value="lavado"> Lavado</label>
                        <label class="check"><input type="checkbox" name="extras" value="perfilado"> Perfilado</label>
                    </div>
                </div>
                <div class="campo">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div class="campo">
                    <label for="hora">Hora</label>
                    <input type="time" id="hora" name="hora" required>
                </div>
                <div class="campo completo">
                    <label for="comentarios">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="3" placeholder="Algo que debamos saber (opcional)"></textarea>
                </div>
                <button type="submit" class="completo">Reservar</button>
            </form>
        </section>

    </main>

    <footer class="footer">
        <p class="footer-copy">&copy; 2026 Barbería Style Good - Todos los derechos reservados</p>
    </footer>
</body>
</html>
